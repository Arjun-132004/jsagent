apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jsagent-app-stripe-webhook-secret
  namespace: storefront-devpython
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: deepagent-aws
    kind: ClusterSecretStore
  target:
    name: app-env
    creationPolicy: Merge
  data:
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: teams-dev/storefront-devpython/STRIPE_WEBHOOK_SECRET
