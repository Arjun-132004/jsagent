apiVersion: apps/v1
kind: Deployment
metadata:
  name: jsagent-client
  namespace: storefront-devjs
  labels:
    app.kubernetes.io/name: jsagent-client
    app.kubernetes.io/managed-by: deepagent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: jsagent-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
      labels:
        app.kubernetes.io/name: jsagent-client
        app.kubernetes.io/managed-by: deepagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jsagent-client
          image: 167313940749.dkr.ecr.us-east-1.amazonaws.com/jsagent-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # WARNING: no /health-style route was detected on this service, so
          # probes are TCP-only. A TCP-only probe passes as soon as the socket
          # accepts, even if the app returns 500 to every request. Add a
          # /health endpoint returning 200 and set probePath in deepagent.yaml
          # to upgrade these probes to httpGet.
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: writable-tmp
              mountPath: /tmp
            - name: writable-var-cache-nginx
              mountPath: /var/cache/nginx
            - name: writable-var-run
              mountPath: /var/run
          envFrom:
            - secretRef:
                name: app-db
                optional: true
            - secretRef:
                name: app-cache
                optional: true
            - secretRef:
                name: app-queue
                optional: true
            - secretRef:
                name: app-env
                optional: true
            - secretRef:
                name: app-env-client
                optional: true
          env:
            - name: PORT
              value: "8080"
            - name: SESSION_COOKIE_SECURE
              value: "false"
            - name: APP_URL
              value: http://app.storefront-devjs.svc.cluster.local
      volumes:
        - name: writable-tmp
          emptyDir: {}
        - name: writable-var-cache-nginx
          emptyDir: {}
        - name: writable-var-run
          emptyDir: {}
