          set -eu
          SHA="${{ github.event.workflow_run.head_sha }}"
          for f in "k8s/pyyyy/dev/client"/*.yaml "k8s/pyyyy/dev/client"/*.yml; do
            [ -f "$f" ] || continue
            sed -i "s|\(image: .*\):latest|\1:$SHA|" "$f"
          done
          echo "pinned client images to $SHA:"
          grep -h "image:" "k8s/pyyyy/dev/client"/*.yaml "k8s/pyyyy/dev/client"/*.yml 2>/dev/null || true

      - name: Apply client manifests
        id: apply_client
